openapi: 3.0.0

info:
  title: Inventory Management API
  version: 1.0.0
  description: API documentation for Inventory Management System

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:

  /register:
    post:
      summary: Register a new user
      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string

      responses:
        201:
          description: User registered successfully

  /login:
    post:
      summary: Login user
      tags:
        - Authentication

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string

      responses:
        200:
          description: Login successful

  /products:
    get:
      summary: Get all products
      tags:
        - Products

      security:
        - bearerAuth: []

      responses:
        200:
          description: List of products

    post:
      summary: Add new product
      tags:
        - Products

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                quantity:
                  type: integer

      responses:
        201:
          description: Product added successfully

  /products/{id}/quantity:
    put:
      summary: Update product quantity
      tags:
        - Products

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quantity:
                  type: integer

      responses:
        200:
          description: Product quantity updated

  /products/{id}:
    delete:
      summary: Delete product
      tags:
        - Products

      security:
        - bearerAuth: []

      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string

      responses:
        200:
          description: Product deleted successfully